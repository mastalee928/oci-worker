server:
  port: 8818

# New API / OpenAI 兼容 HTTP：独立端口，与面板(8818) 分离。Base URL 示例 http://<本机或反代地址>:<openaiApi.port>/v1

webssh:
  timeout-minutes: 120
  # 普通 SSH 终端的资源边界；OCI 串行控制台 /console-term 不读取这些限制。
  first-message-timeout-seconds: 20
  max-concurrent-sessions: 64
  max-input-message-size: 65536
  send-time-limit-ms: 10000
  send-buffer-bytes: 1048576
  max-upload-size: 200MB
ociworker:
  openaiApi:
    # 0 = 不启用第二端口；>0 且与 server.port 不同时，Tomcat 额外监听该口供 /v1 等 OpenAI 路由
    port: 8080
  openaiLoadBalance:
    # 固定负载均衡入口。默认 50000，Base URL 为 http://<本机或域名>:50000/v1
    port: 50000
  telegram:
    # Bot 更新由服务端 getUpdates 长轮询接收（无需 Webhook、无需公网 HTTPS 指向本机）。
    # 以下两项已废弃，保留仅为兼容旧环境变量占位（代码不再读取）。
    webhook-secret: ${TG_WEBHOOK_SECRET:}
    webhook-secret-token: ${TG_WEBHOOK_SECRET_TOKEN:}

web:
  account: admin
  password: admin123

spring:
  threads:
    virtual:
      # 面板请求使用平台线程，避免与长耗时 OCI 抢机虚拟线程争抢载体线程而出现全站卡顿。
      enabled: false
  servlet:
    multipart:
      max-file-size: ${webssh.max-upload-size:200MB}
      max-request-size: ${webssh.max-upload-size:200MB}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/oci_worker?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ociworker
    password: ociworker123
    hikari:
      # 低负载保留少量连接，突发时按需增长；获取连接快速失败，避免页面固定卡 30 秒。
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 30
      minimum-idle: 4
      idle-timeout: 300000
      # 数据库操作应为短连接；持有超过 15 秒记录借出堆栈，便于定位长事务/连接泄漏。
      leak-detection-threshold: 15000
      register-mbeans: true
      # 连接在池里的最长存活（须小于 MySQL 的 wait_timeout，并留 1 分钟以上余量）
      max-lifetime: 1500000
      # 定期对空闲连接发保活，减少「服务端已关、池里还以为能用」
      keepalive-time: 120000
  sql:
    init:
      mode: never
  ai:
    openai:
      api-key: sk-xxx
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B

mybatis-plus:
  mapper-locations: classpath*:com/ociworker/mapper/xml/*.xml,classpath*:mapper/*.xml

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n"
  level:
    com.oracle.bmc: error
    c.o.b.h.c.j: error

oci-cfg:
  key-dir-path: ./keys
